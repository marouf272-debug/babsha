# Every push and pull request: the full test suite (plan 4.4). Releases call this first.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Unit, data and simulation tests
        run: npm test
      - name: Type check, language parity and build
        run: npm run build
      - name: End to end tests on the production build
        run: npm run test:e2e
      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
