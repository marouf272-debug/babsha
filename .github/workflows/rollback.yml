# Rollback (plan phase 6, D-104): puts the exact build of an earlier release back live, from the
# zip kept on its GitHub Release. Nothing is rebuilt. Run it from the Actions tab or with
#   gh workflow run rollback.yml -f tag=v1.0.0
name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to put back live, for example v1.0.0
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the kept build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "babsha-$TAG.zip"
          mkdir site && unzip -q "babsha-$TAG.zip" -d site
          grep -q "\"version\":\"${TAG#v}\"" site/version.json || { echo "site/version.json does not say ${TAG#v}"; exit 1; }
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
